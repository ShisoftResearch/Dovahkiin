[package]
name = "dovahkiin"
version = "0.1.0"
authors = ["Hao Shi <shisoftgenius@gmail.com>"]
edition = "2021"

[lib]
name = "dovahkiin"

[[test]]
name = "tests"

[dependencies]
serde = "*"
serde_derive = "*"
byteorder = "1"
bifrost = { path = "../bifrost" }
bifrost_plugins = { path = "../bifrost/src/plugins" }
bifrost_hasher = { path = "../bifrost/src/hasher" }
lazy_static = "*"
log = "*"
ahash = "0.8.11"
smallvec = {version = "1.15.0", features = ["serde"]}
